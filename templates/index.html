{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>Scan any web page</h1>
  <p class="lead">
    Paste a website address to get its Lighthouse scores, key timings and a
    prioritised list of fixes.
  </p>

  {% if error %}
  <p class="alert">{{ error }}</p>
  {% endif %}

  <!-- The form posts to /scan, which is handled in app.py -->
  <form class="scan-form" action="{{ url_for('scan') }}" method="post">
    <input
      type="text"
      name="url"
      placeholder="https://example.com"
      value="{{ url or '' }}"
      required
    />
    <select name="strategy">
      <option value="mobile">Mobile</option>
      <option value="desktop">Desktop</option>
    </select>
    <button type="submit">Scan</button>
  </form>

  <p class="hint">A scan usually takes 20-40 seconds.</p>
</section>
{% endblock %}
