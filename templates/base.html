<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Lighthouse Performance Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}">Lighthouse Performance Monitor</a>
    </header>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      Powered by the Google PageSpeed Insights API (Lighthouse).
    </footer>
  </body>
</html>
